name: CEREBRON cold benchmark protocol smoke
on:
  push:
    paths: ["worker/**", ".github/workflows/benchmark-smoke.yml"]
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python worker/benchmark_gate.py
      - uses: actions/upload-artifact@v4
        with: {name: benchmark-protocol-artifact, path: artifacts/benchmark-gate.json}
